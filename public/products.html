<body data-page="products">
<main>

<div class="page-head"><div class="wrap">

<section style="padding:20px 0 110px"><div class="wrap-wide" style="max-width:1280px"><div class="catalog">

      <select id="sort" aria-label="Sort"><option value="" data-i18n="sort.default">Featured</option><option value="low" data-i18n="sort.low">Price: Low to high</option><option value="high" data-i18n="sort.high">Price: High to low</option></select>
      <span class="small" id="result-count"></span>
    </div>
    <div class="grid g4" id="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
