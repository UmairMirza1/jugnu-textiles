<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Jugnu</title>
<meta name="description" content="Visit or contact Jugnu in Ichra Bazaar, Lahore. Phone, WhatsApp, email and directions.">
<meta property="og:title" content="Contact — Jugnu"><meta property="og:description" content="Visit or contact Jugnu in Ichra Bazaar, Lahore. Phone, WhatsApp, email and directions."><meta property="og:image" content="/img/hero.jpg">
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23c99a2e' opacity='.3'/><circle cx='16' cy='16' r='7' fill='%23c99a2e'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<main>

<div class="page-head"><div class="wrap">
  <h1 class="headline reveal" data-i18n="nav.contact">Let's talk.</h1>
  <p class="lead reveal d1">Call, WhatsApp, write to us or visit in Ichra. We reply quickly during business hours.</p>
</div></div>
<section style="padding:20px 0 110px"><div class="wrap split" style="align-items:start">
  <div class="reveal">
    <div class="card feature" style="margin-bottom:20px;display:grid;gap:18px">
      <div><span class="small">Visit</span><br><b id="c-address" style="font-weight:500"></b></div>
      <div><span class="small">Call</span><br><span id="c-phone"></span></div>
      <div><span class="small">Email</span><br><span id="c-email"></span></div>
      <div><span class="small">Hours</span><br>Mon–Sat, 10 AM – 8 PM<br><span class="small">Closed Friday 1–3 PM for Jummah</span></div>
      <a class="btn btn-wa" id="c-wa" target="_blank" rel="noopener" style="justify-self:start">Chat on WhatsApp</a>
    </div>
    <iframe class="map" title="Map of Ichra, Lahore" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=Ichra%20Bazaar%2C%20Lahore&z=15&output=embed"></iframe>
  </div>
  <form class="form-card reveal d1" id="contact-form" novalidate>
    <h3>Send a message.</h3>
    <div class="form-msg"></div>
    <div class="row2"><div class="field"><label data-i18n="f.name">Name</label><input name="name" required></div>
      <div class="field"><label data-i18n="f.phone">Phone / WhatsApp</label><input name="phone" required inputmode="tel" placeholder="03xx xxxxxxx"></div></div>
    <div class="row2"><div class="field"><label data-i18n="f.email">Email (optional)</label><input name="email" type="email"></div>
      <div class="field"><label data-i18n="f.city">City</label><input name="city"></div></div>
    <div class="field"><label data-i18n="f.msg">Message</label><textarea name="message" rows="5" required></textarea></div>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="btn btn-blue" style="width:100%" data-i18n="btn.send">Send message</button>
  </form>
</div></section>
</main>
<script type="module" src="js/app.js"></script>
</body></html>
